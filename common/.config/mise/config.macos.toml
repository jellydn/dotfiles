# Loaded on macOS when auto_env is enabled (see miserc.toml).
# Sources are relative to this file: common/.config/mise/
# macos files go through ../macos-home (symlink to ../../macos) so they still
# resolve when this config is loaded via ~/Projects/.config.
# Host packages are poured by mise into /opt/homebrew — no Homebrew CLI required.
# Not linked here: ~/.config/karabiner, flashspace, ~/.skhdrc (live local state).
# yabai is source-only; install with: mise bootstrap packages apply brew:koekeishiya/formulae/yabai

[dotfiles]
"~/.alacritty.toml" = { source = "../macos-home/.alacritty.toml", mode = "symlink" }
"~/.aerospace.toml" = { source = "../macos-home/.aerospace.toml", mode = "symlink" }
"~/.wezterm.lua" = { source = "../macos-home/.wezterm.lua", mode = "symlink" }
"~/.yabairc" = { source = "../macos-home/.yabairc", mode = "symlink" }
"~/.zshrc" = { source = "../macos-home/.zshrc", mode = "symlink" }
"~/yabai.sh" = { source = "../macos-home/yabai.sh", mode = "symlink" }
"~/.config/sketchybar" = { source = "../macos-home/.config/sketchybar", mode = "symlink" }
"~/.config/rectangle" = { source = "../macos-home/.config/rectangle", mode = "symlink" }
"~/.config/leader-key" = { source = "../macos-home/.config/leader-key", mode = "symlink" }
"~/.config/tuna" = { source = "../macos-home/.config/tuna", mode = "symlink" }

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[bootstrap.brew]
adopt = true

[bootstrap.brew.taps]
"FelixKratz/formulae" = "https://github.com/FelixKratz/homebrew-formulae.git"
"koekeishiya/formulae" = "https://github.com/koekeishiya/homebrew-formulae.git"

[bootstrap.packages]
"brew:fish" = "latest"
"brew:fastfetch" = "latest"
"brew:stow" = "latest"
"brew:tmux" = "latest"
"brew:git" = "latest"
"brew:lua" = "latest"
"brew:switchaudio-osx" = "latest"
"brew:nowplaying-cli" = "latest"
"brew:FelixKratz/formulae/sketchybar" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:font-maple-mono-nf" = "latest"
"brew-cask:font-fontawesome" = "latest"
"brew-cask:sf-symbols" = "latest"
"brew-cask:font-sf-mono" = "latest"
"brew-cask:font-sf-pro" = "latest"

[tasks.bootstrap]
description = "SketchyBar app font and SbarLua (no brew token)"
dir = "{{ get_env(name='XDG_CONFIG_HOME', default=env.HOME ~ '/.config') }}/mise"
run = "bash macos-extras.sh"
