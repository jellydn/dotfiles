# Machine + workspace setup. See https://mise.jdx.dev/dotfiles.html
# Apply with: mise bootstrap --dry-run && mise bootstrap
#
# This file is stowed to ~/.config/mise/config.toml.
# ~/Projects/.config also points here, so every repo under ~/Projects
# loads these tools without a per-project mise.toml.

# Prefer HTTP backends. GitHub git protocol times out here.
[tool_alias]
neovim = "github:neovim/neovim"
bat = "aqua:sharkdp/bat"
fzf = "aqua:junegunn/fzf"
rg = "aqua:BurntSushi/ripgrep"
yarn = "npm:yarn"
ffmpeg = "conda:ffmpeg"

[tools]
node = "lts"
python = "latest"
go = "latest"
rust = "latest"
deno = "latest"
bun = "latest"
uv = "latest"
lua-language-server = "latest"
ruby = "latest"
stylua = "latest"
fd = "latest"
bat = "latest"
fzf = "latest"
jq = "latest"
delta = "latest"
lazygit = "latest"
gh = "latest"
neovim = "nightly"
zoxide = "latest"
shellcheck = "latest"
yarn = "1.22.22"
ruff = "latest"
black = "latest"
usage = "latest"
rg = "latest"
ffmpeg = "latest"
rye = "latest"
difftastic = "latest"
jj = "latest"
dprint = "latest"
biome = "latest"
hurl = "latest"
just = "latest"
prettier = "latest"
yamllint = "latest"
shfmt = "latest"
prek = "latest"
dotnet = "latest"
ctop = "latest"
aube = "latest"
task = "latest"
tree-sitter = "latest"
taplo = "latest"
hk = "latest"
pkl = "latest"

[settings]
auto_install = true
idiomatic_version_file_enable_tools = ["node"]
# Secrets: copy config.local.example.toml → config.local.toml (gitignored).
# [dotfiles] source paths are relative to this file (common/.config/mise),
# not ~/.dotfiles. Do not set settings.dotfiles.root here.

[dotfiles]
"~/.gitconfig" = { source = "../../.gitconfig", mode = "symlink" }
"~/.ideavimrc" = { source = "../../.ideavimrc", mode = "symlink" }
"~/.agent-os" = { source = "../../.agent-os", mode = "symlink" }
"~/bg-images" = { source = "../../bg-images", mode = "symlink" }
"~/.config/fish" = { source = "../fish", mode = "symlink" }
"~/.config/ghostty" = { source = "../ghostty", mode = "symlink" }
"~/.config/helix" = { source = "../helix", mode = "symlink" }
"~/.config/k9s" = { source = "../k9s", mode = "symlink" }
"~/.config/kitty" = { source = "../kitty", mode = "symlink" }
"~/.config/lazygit" = { source = "../lazygit", mode = "symlink" }
"~/.config/nvim" = { source = "../nvim", mode = "symlink" }
"~/.config/tmux" = { source = "../tmux", mode = "symlink" }
"~/.config/vscode" = { source = "../vscode", mode = "symlink" }
"~/.config/zed" = { source = "../zed", mode = "symlink" }
"~/.config/zellij" = { source = "../zellij", mode = "symlink" }
"~/.alacritty.toml" = { source = "../../../macos/.alacritty.toml", mode = "symlink", os = "macos" }
"~/.aerospace.toml" = { source = "../../../macos/.aerospace.toml", mode = "symlink", os = "macos" }
"~/.wezterm.lua" = { source = "../../../macos/.wezterm.lua", mode = "symlink", os = "macos" }
"~/.yabairc" = { source = "../../../macos/.yabairc", mode = "symlink", os = "macos" }
"~/.zshrc" = { source = "../../../macos/.zshrc", mode = "symlink", os = "macos" }
"~/yabai.sh" = { source = "../../../macos/yabai.sh", mode = "symlink", os = "macos" }
"~/.config/sketchybar" = { source = "../../../macos/.config/sketchybar", mode = "symlink", os = "macos" }
"~/.config/rectangle" = { source = "../../../macos/.config/rectangle", mode = "symlink", os = "macos" }
"~/.config/leader-key" = { source = "../../../macos/.config/leader-key", mode = "symlink", os = "macos" }

# zshrc (not zsh) is the startup-file key; `zsh = true` would also write zprofile shims.
[bootstrap.mise_shell_activate]
fish = "activate"
zshrc = "activate"

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

[bootstrap.packages]
"brew:fish" = { os = "macos" }
"brew:fastfetch" = { os = "macos" }
"brew:stow" = { os = "macos" }
