# Minimal Foot Configuration for Simple KooL Hyprland
# For advanced configuration, see: https://codeberg.org/dnkl/foot/src/branch/master/foot.ini

[main]
font=Maple Mono NF:size=14
shell=/bin/fish
term=xterm-256color
pad=8x8

[colors]
# Kanagawa theme
background=1F1F28
foreground=DCD7BA

# Basic colors
regular0=090618  # black
regular1=C34043  # red
regular2=76946A  # green
regular3=C0A36E  # yellow
regular4=7E9CD8  # blue
regular5=957FB8  # magenta
regular6=7AA89F  # cyan
regular7=C8C093  # white

bright0=727169   # bright black
bright1=E82424   # bright red
bright2=98BB6C   # bright green
bright3=E6C384   # bright yellow
bright4=7FB4CA   # bright blue
bright5=D27E99   # bright magenta
bright6=7AA89F   # bright cyan
bright7=DCD7BA   # bright white

# Keep in sync with docs/terminal-keys.md
[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
# Ctrl+- is Neovim <c-_>. Font size uses Ctrl+Shift.
font-increase=Control+plus Control+equal Control+Shift+plus Control+KP_Add
font-decrease=Control+Shift+minus Control+KP_Subtract
spawn-terminal=Control+Shift+n
search-start=Control+Shift+f Control+Shift+r

[text-bindings]
\x1f=Control+minus
cmdk -s\x0d=Control+Shift+l
